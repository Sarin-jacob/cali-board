<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CaliBoard — camera calibration in your browser</title>
    <meta name="description" content="Free, private camera calibration that runs entirely in your browser: print targets, calibrate pinhole and fisheye lenses, stereo pairs, validate and export to OpenCV, ROS, Kalibr and COLMAP." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="min-h-dvh">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/85">
      <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-2 sm:px-6">
        <a href="#/" class="flex items-center gap-2 rounded-lg py-1 pr-2 font-bold tracking-tight text-slate-900 dark:text-white" aria-label="CaliBoard home">
          <img src="./favicon.svg" alt="" class="size-7" width="28" height="28" />
          <span class="text-lg">CaliBoard</span>
        </a>
        <nav aria-label="Main" class="ml-auto hidden lg:block">
          <ul id="nav-desktop" class="flex items-center gap-1"></ul>
        </nav>
        <div id="engine-status" class="ml-auto lg:ml-2"></div>
      </div>
      <nav aria-label="Main (compact)" class="border-t border-slate-200 lg:hidden dark:border-slate-800">
        <ul id="nav-mobile" class="mx-auto flex max-w-7xl gap-1 overflow-x-auto px-2 py-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"></ul>
      </nav>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-7xl px-4 pb-16 pt-6 outline-none sm:px-6"></main>

    <footer class="mx-auto max-w-7xl px-4 pb-10 text-xs text-slate-500 sm:px-6 dark:text-slate-400">
      <p>Runs entirely on your device — images never leave this browser. Powered by OpenCV (WebAssembly).</p>
    </footer>

    <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="sr-alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
    <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
