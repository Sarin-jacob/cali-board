<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenCV.js WebAssembly Full Integration Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas { border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; width: 100%; height: auto; image-rendering: pixelated; }
        .pass { color: #16a34a; font-weight: bold; }
        .fail { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-slate-900 border-b pb-2">WebAssembly Integration Tests</h1>
        <div id="status" class="text-lg font-medium text-amber-600">⏳ Loading OpenCV Engine...</div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
            <!-- Test 1: ArUco -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-2 border-b pb-2">1. ArUco Engine</h2>
                <ul id="log-aruco" class="text-sm space-y-1 mb-4 font-mono text-slate-600 min-h-[120px]"></ul>
                <canvas id="canvas-aruco"></canvas>
            </div>

            <!-- Test 2: ChArUco -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-2 border-b pb-2">2. ChArUco Engine</h2>
                <ul id="log-charuco" class="text-sm space-y-1 mb-4 font-mono text-slate-600 min-h-[120px]"></ul>
                <canvas id="canvas-charuco"></canvas>
            </div>

            <!-- Test 3: Checkerboard SB & SubPix -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold mb-2 border-b pb-2">3. Checkerboard (SB)</h2>
                <ul id="log-checker" class="text-sm space-y-1 mb-4 font-mono text-slate-600 min-h-[120px]"></ul>
                <canvas id="canvas-checker"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- NATIVE WASM MEMORY HELPERS ---
        // Bypasses the buggy cv.imread and cv.imshow helpers by using raw array buffers
        function canvasToMat(canvas) {
            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            return cv.matFromImageData(imgData);
        }

        function matToCanvas(mat, canvasId) {
            const canvas = document.getElementById(canvasId);
            canvas.width = mat.cols;
            canvas.height = mat.rows;
            const ctx = canvas.getContext('2d');
            
            const destMat = new cv.Mat();
            if (mat.channels() === 1) cv.cvtColor(mat, destMat, cv.COLOR_GRAY2RGBA);
            else if (mat.channels() === 3) cv.cvtColor(mat, destMat, cv.COLOR_RGB2RGBA);
            else mat.copyTo(destMat);

            const imgData = new ImageData(new Uint8ClampedArray(destMat.data), destMat.cols, destMat.rows);
            ctx.putImageData(imgData, 0, 0);
            destMat.delete();
        }

        // --- DYNAMIC OPENCV LOADER ---
        window.__cvSettled = false;
        
        let script = document.createElement('script');
        script.src = './opencv4.13.js'; // MUST MATCH YOUR COMPILED FILE NAME
        script.onload = async () => {
            if (typeof cv === 'function') window.cv = await cv();
            else if (typeof cv !== 'undefined' && cv instanceof Promise) window.cv = await cv;
            else if (typeof cv !== 'undefined' && cv.ready instanceof Promise) await cv.ready;

            if (typeof cv !== 'undefined' && cv.Mat && !window.__cvSettled) {
                window.__cvSettled = true;
                runTests();
            }
        };
        document.head.appendChild(script);

        // --- BULLETPROOF CV UTILS ---
        const CV_UTILS = {
            fn: function (...names) { for (const n of names) if (cv[n] !== undefined) return cv[n]; return null; },
            klass: function (...names) { for (const n of names) if (cv[n] !== undefined) return cv[n]; return null; },
            scalar: function (a, b, c, d) { return (typeof cv.Scalar === 'function') ? new cv.Scalar(a, b, c, d) : [a, b, c, d]; },
            
            getDict: function (dictName) {
                const fallbackMap = { 'DICT_6X6_250': 10 };
                let raw = cv[dictName] !== undefined ? cv[dictName] : fallbackMap[dictName];
                const dictId = (raw && typeof raw === 'object' && 'value' in raw) ? raw.value : raw;
                
                let f = cv.getPredefinedDictionary || cv.aruco_getPredefinedDictionary;
                return f(dictId);
            },
            drawMarker: function (dict, id, size, img) {
                let f = cv.generateImageMarker || cv.aruco_generateImageMarker;
                if (f) return f(dict, id, size, img, 1);
            },
            newDetectorParameters: function () {
                const K = this.klass('aruco_DetectorParameters', 'DetectorParameters');
                return new K();
            },
            newRefineParameters: function () {
                const K = this.klass('aruco_RefineParameters', 'RefineParameters');
                if (!K) return null;
                try { return new K(10, 3, true); } catch(e) { return null; }
            },
            // FIX: Safely passing 3 arguments to the strict 4.x ArucoDetector constructor
            newArucoDetector: function (dict, params, refine) {
                const K = this.klass('aruco_ArucoDetector', 'ArucoDetector');
                if (refine) {
                    try { return new K(dict, params, refine); } catch (e) {}
                }
                return new K(dict, params);
            },
            createCharucoBoard: function (cols, rows, sqSz, mkSz, dict) {
                const K = this.klass('aruco_CharucoBoard', 'CharucoBoard');
                const sz = new cv.Size(cols, rows);
                try { return new K(sz, sqSz, mkSz, dict); } 
                catch (e) { const emp = new cv.Mat(); const b = new K(sz, sqSz, mkSz, dict, emp); emp.delete(); return b; }
            },
            // FIX: Safely passing 4 arguments to the strict 4.x CharucoDetector constructor
            newCharucoDetector: function (board, charucoParams, detectorParams, refineParams) {
                const K = this.klass('aruco_CharucoDetector', 'CharucoDetector');
                try { return new K(board, charucoParams, detectorParams, refineParams); } catch(e) {}
                try { return new K(board, charucoParams, detectorParams); } catch(e) {}
                try { return new K(board); } catch(e) {}
                throw new Error("Failed to map CharucoDetector constructor");
            },
            drawCharucoBoard: function (board, outSize, img) {
                if (typeof board.generateImage === 'function') return board.generateImage(outSize, img, 0, 1);
            },
            drawDetectedMarkers: function (img, corners, ids) {
                let f = cv.drawDetectedMarkers || cv.aruco_drawDetectedMarkers;
                f(img, corners, ids, this.scalar(0, 255, 0, 255));
            },
            drawDetectedCornersCharuco: function (img, corners, ids) {
                let f = cv.drawDetectedCornersCharuco || cv.aruco_drawDetectedCornersCharuco;
                f(img, corners, ids, this.scalar(255, 0, 0, 255));
            }
        };

        function addLog(targetId, msg, isSuccess) {
            const ul = document.getElementById(targetId);
            const li = document.createElement('li');
            li.innerHTML = isSuccess === true ? `<span class="pass">✔ ${msg}</span>` : 
                           isSuccess === false ? `<span class="fail">✖ ${msg}</span>` : `> ${msg}`;
            ul.appendChild(li);
        }

        async function runTests() {
            document.getElementById('status').innerHTML = '<span class="pass">✅ OpenCV WebAssembly Ready. Running strict tests...</span>';

            // ==========================================
            // TEST 1: ARUCO
            // ==========================================
            try {
                addLog('log-aruco', 'Allocating memory...');
                const dict = CV_UTILS.getDict('DICT_6X6_250');
                const markerImg = new cv.Mat();
                
                addLog('log-aruco', 'Generating Marker (ID: 42)...');
                CV_UTILS.drawMarker(dict, 42, 160, markerImg);
                
                const colorImg = new cv.Mat();
                cv.cvtColor(markerImg, colorImg, cv.COLOR_GRAY2RGB);

                // FIX: Add a white margin (Quiet Zone) so the detector can see the black borders!
                const paddedImg = new cv.Mat();
                cv.copyMakeBorder(colorImg, paddedImg, 40, 40, 40, 40, cv.BORDER_CONSTANT || 0, new cv.Scalar(255, 255, 255, 255));

                addLog('log-aruco', 'Running strict 4.x ArucoDetector...');
                const params = CV_UTILS.newDetectorParameters();
                const refine = CV_UTILS.newRefineParameters();
                
                const detector = CV_UTILS.newArucoDetector(dict, params, refine);
                
                const corners = new cv.MatVector();
                const ids = new cv.Mat();
                detector.detectMarkers(paddedImg, corners, ids);

                if (ids.rows > 0) {
                    addLog('log-aruco', `Detected ${ids.rows} marker!`, true);
                    CV_UTILS.drawDetectedMarkers(paddedImg, corners, ids);
                } else {
                    addLog('log-aruco', 'Detection failed.', false);
                }

                matToCanvas(paddedImg, 'canvas-aruco');

                markerImg.delete(); colorImg.delete(); paddedImg.delete(); corners.delete(); ids.delete(); 
                params.delete(); if (refine) refine.delete(); detector.delete();
                addLog('log-aruco', 'Memory freed.', true);
            } catch (e) { addLog('log-aruco', e.message, false); console.error("ArUco Error:", e); }

            // ==========================================
            // TEST 2: CHARUCO (Already passing!)
            // ==========================================
            try {
                addLog('log-charuco', 'Allocating memory...');
                const dict = CV_UTILS.getDict('DICT_6X6_250');
                const board = CV_UTILS.createCharucoBoard(5, 5, 40, 25, dict);
                const boardImg = new cv.Mat();

                addLog('log-charuco', 'Generating 5x5 Board...');
                CV_UTILS.drawCharucoBoard(board, new cv.Size(200, 200), boardImg);

                const colorImg = new cv.Mat();
                cv.cvtColor(boardImg, colorImg, cv.COLOR_GRAY2RGB);

                addLog('log-charuco', 'Running strict 4.x CharucoDetector...');
                
                const CP = CV_UTILS.klass('aruco_CharucoParameters', 'CharucoParameters');
                const cp = CP ? new CP() : null;
                const dp = CV_UTILS.newDetectorParameters();
                const rp = CV_UTILS.newRefineParameters();
                
                const charucoDetector = CV_UTILS.newCharucoDetector(board, cp, dp, rp);
                
                const markerCorners = new cv.MatVector();
                const markerIds = new cv.Mat();
                const charucoCorners = new cv.Mat();
                const charucoIds = new cv.Mat();

                const arucoDetector = CV_UTILS.newArucoDetector(dict, dp, rp);
                arucoDetector.detectMarkers(colorImg, markerCorners, markerIds);
                charucoDetector.detectBoard(colorImg, charucoCorners, charucoIds, markerCorners, markerIds);

                if (charucoIds.rows > 0) {
                    addLog('log-charuco', `Detected ${charucoIds.rows} inner corners!`, true);
                    CV_UTILS.drawDetectedCornersCharuco(colorImg, charucoCorners, charucoIds);
                } else {
                    addLog('log-charuco', 'Detection failed.', false);
                }

                matToCanvas(colorImg, 'canvas-charuco');

                board.delete(); boardImg.delete(); colorImg.delete();
                markerCorners.delete(); markerIds.delete(); charucoCorners.delete(); charucoIds.delete();
                charucoDetector.delete(); arucoDetector.delete();
                if(cp) cp.delete(); dp.delete(); if(rp) rp.delete();
                
                addLog('log-charuco', 'Memory freed.', true);
            } catch (e) { addLog('log-charuco', e.message, false); console.error("ChArUco Error:", e); }

            // ==========================================
            // TEST 3: CHECKERBOARD & CORNER SUB-PIX
            // ==========================================
            try {
                addLog('log-checker', 'Drawing custom checkerboard (with margins)...');
                const canvas = document.createElement('canvas');
                // FIX: Expanded canvas size from 200 to 240 to add a 20px quiet zone margin
                canvas.width = 240; canvas.height = 240;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "white"; ctx.fillRect(0, 0, 240, 240);
                ctx.fillStyle = "black";
                // Offset the drawing by 20px so black squares never touch the edge
                for(let r=0; r<5; r++) for(let c=0; c<5; c++) if((r+c)%2!==0) ctx.fillRect(20 + (c*40), 20 + (r*40), 40, 40);
                
                const cbImg = canvasToMat(canvas);
                const grayImg = new cv.Mat();
                cv.cvtColor(cbImg, grayImg, cv.COLOR_RGBA2GRAY);

                addLog('log-checker', 'findChessboardCorners (Classic)...');
                const patternSize = new cv.Size(4, 4);
                const corners = new cv.Mat();
                
                // Use classic flags: ADAPTIVE_THRESH (1) + NORMALIZE_IMAGE (2)
                const flags = (cv.CALIB_CB_ADAPTIVE_THRESH || 1) + (cv.CALIB_CB_NORMALIZE_IMAGE || 2);
                const found = cv.findChessboardCorners(grayImg, patternSize, corners, flags);

                if (found) {
                    addLog('log-checker', 'Corners found! Running subPix...', true);
                    const criteria = new cv.TermCriteria(cv.TERM_CRITERIA_EPS + cv.TERM_CRITERIA_MAX_ITER, 30, 0.1);
                    cv.cornerSubPix(grayImg, corners, new cv.Size(5, 5), new cv.Size(-1, -1), criteria);
                    
                    if (cv.drawChessboardCorners) {
                        cv.drawChessboardCorners(cbImg, patternSize, corners, found);
                        addLog('log-checker', 'SubPix refined & drawn.', true);
                    }
                } else {
                    addLog('log-checker', 'Failed to find corners.', false);
                }

                matToCanvas(cbImg, 'canvas-checker');

                cbImg.delete(); grayImg.delete(); corners.delete();
                addLog('log-checker', 'Memory freed.', true);
            } catch (e) { addLog('log-checker', e.message, false); console.error("Checkerboard Error:", e); }
        }

    </script>
</body>
</html>
